name: Verificar contas a vencer

on:
  schedule:
    # Cron do GitHub Actions é sempre em UTC.
    # 09:00 no horário de Brasília (UTC-3) = 12:00 UTC.
    - cron: '0 12 * * *'
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions, pra testar

jobs:
  check-bills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do script
        working-directory: scripts
        run: npm install

      - name: Salvar credenciais do Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/gcp-key.json

      - name: Rodar verificação de contas a vencer
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/gcp-key.json
        run: node check-bills.js
